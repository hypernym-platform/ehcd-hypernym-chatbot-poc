# Auto-build + deploy to the EHCD dev AKS cluster on every push to `development`.
# No SSH, no docker, no secrets — auth is passwordless OIDC (federated identity).
# ACR builds the image server-side; the dev Deployment is restarted to pull the new
# :dev-v1.0 tag (imagePullPolicy: Always). Chatbot is strategy: Recreate → brief blip.
name: deploy-dev

on:
  push:
    branches: [development]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, no secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Dependencies live in ehcd-chatbot-base, tagged with a hash of requirements.txt.
      # Unchanged requirements -> tag already exists -> skip the faiss/langchain pip
      # install entirely and the app build is just a COPY. Keep in sync with deploy-dev.sh.
      - name: Build deps base image if requirements.txt changed
        id: base
        run: |
          BASE_TAG="reqs-$(sha256sum requirements.txt | cut -c1-12)"
          echo "tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
          if az acr repository show-tags -n acrehcddev --repository ehcd-chatbot-base -o tsv 2>/dev/null | grep -qx "$BASE_TAG"; then
            echo "deps base image current: $BASE_TAG"
          else
            az acr build -r acrehcddev -t "ehcd-chatbot-base:$BASE_TAG" \
              -f Dockerfile.base --platform linux/amd64 .
          fi

      - name: Build image in ACR
        run: |
          az acr build -r acrehcddev \
            -t ehcd-chatbot:dev-v1.0 \
            --build-arg BASE=acrehcddev.azurecr.io/ehcd-chatbot-base:${{ steps.base.outputs.tag }} \
            --build-arg APP_ENV=dev \
            --platform linux/amd64 .

      - name: Redeploy on dev AKS
        run: |
          az aks command invoke -g rg-ehcd-dev -n aks-ehcd-dev \
            --command "kubectl -n dev rollout restart deploy/ehcd-chatbot && kubectl -n dev rollout status deploy/ehcd-chatbot --timeout=300s"
